<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SkyMind Altın Küme İnceleme</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --ink: #14181f; --muted: #667085; --line: #d9dde3;
    --ok: #1a7f4b; --ok-bg: #e3f4ea; --bad: #b42318; --bad-bg: #fde8e6; --mark: #fff0a8; --accent: #2457d6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101319; --card: #181c24; --ink: #eceff4; --muted: #98a2b3; --line: #2a303b;
      --ok: #4ade80; --ok-bg: #12301f; --bad: #f87171; --bad-bg: #3a1716; --mark: #5c4d00; --accent: #7aa2ff;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, "Segoe UI", sans-serif; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 16px; }
  header { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: baseline; margin-bottom: 8px; }
  header h1 { font-size: 15px; margin: 0; color: var(--muted); font-weight: 600; letter-spacing: .02em; }
  .stats { font-variant-numeric: tabular-nums; font-size: 14px; color: var(--muted); }
  .stats b { color: var(--ink); }
  .bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-bottom: 14px; }
  .bar > i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .15s; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 22px 24px; }
  .chip { display: inline-block; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em;
          padding: 2px 10px; border-radius: 99px; background: var(--line); color: var(--muted); }
  .chip.plan { background: #dbe7ff; color: #1d3f9e; } .chip.clarification { background: #fff1d6; color: #8a5200; }
  .chip.refusal { background: #ffe0e0; color: #9b1c1c; }
  @media (prefers-color-scheme: dark) {
    .chip.plan { background: #1c2a4d; color: #9db8ff; } .chip.clarification { background: #3b2c10; color: #ffcc7a; }
    .chip.refusal { background: #411a1a; color: #ff9d9d; }
  }
  .label { margin: 18px 0 4px; font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
  .cmd { font-size: 24px; line-height: 1.35; font-weight: 600; margin: 8px 0 0; word-break: break-word; }
  .cmd.edited { color: var(--accent); }
  .cmdinput { width: 100%; font: inherit; font-size: 22px; font-weight: 600; padding: 8px 10px; border-radius: 8px;
              border: 2px solid var(--accent); background: var(--card); color: var(--ink); }
  mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 2px; }
  .out { font-size: 19px; }
  .out ol { margin: 0; padding-left: 26px; } .out li { margin: 4px 0; }
  .out .q { font-weight: 600; }
  pre { background: var(--bg); border: 1px solid var(--line); padding: 10px; border-radius: 8px; font-size: 13px;
        overflow: auto; margin: 10px 0 0; }
  .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; }
  button { font: inherit; font-weight: 700; font-size: 18px; padding: 16px 12px; border-radius: 12px; cursor: pointer;
           border: 2px solid transparent; }
  button small { display: block; font-weight: 500; font-size: 12px; opacity: .75; }
  .good { background: var(--ok-bg); color: var(--ok); border-color: var(--ok); }
  .wrong { background: var(--bad-bg); color: var(--bad); border-color: var(--bad); }
  .sub { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .sub button { font-size: 14px; font-weight: 600; padding: 8px 14px; background: var(--card); color: var(--ink);
                border: 1px solid var(--line); border-radius: 8px; }
  .help { margin-top: 14px; font-size: 13px; color: var(--muted); }
  kbd { background: var(--card); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 0 6px; font: 12px ui-monospace, monospace; }
  .toast { position: fixed; right: 14px; bottom: 14px; background: var(--card); border: 1px solid var(--line);
           padding: 8px 14px; border-radius: 10px; font-size: 13px; color: var(--muted); }
  .toast.err { border-color: var(--bad); color: var(--bad); font-weight: 700; }
  .done { text-align: center; padding: 40px 10px; } .done h2 { margin-top: 0; }
  code { background: var(--bg); padding: 2px 6px; border-radius: 5px; }
  .reasons { margin-top: 12px; font-size: 14px; color: var(--muted); }
  .rchips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .rchip { font: inherit; font-size: 13px; font-weight: 500; padding: 5px 10px; border-radius: 99px;
           background: var(--card); color: var(--ink); border: 1px solid var(--line); cursor: pointer; }
  .rchip.on { border-color: var(--bad); background: var(--bad-bg); color: var(--bad); font-weight: 700; }
  .map { display: flex; flex-wrap: wrap; gap: 3px; margin-bottom: 12px; }
  .cell { width: 11px; height: 11px; border-radius: 3px; background: var(--line); cursor: pointer; }
  .cell.ok { background: var(--ok); } .cell.bad { background: var(--bad); }
  .cell.cur { outline: 2px solid var(--accent); outline-offset: 1px; }
  .top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .pos { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .badge { font-size: 13px; font-weight: 700; padding: 2px 10px; border-radius: 99px; margin-left: auto; }
  .badge.ok { background: var(--ok-bg); color: var(--ok); } .badge.bad { background: var(--bad-bg); color: var(--bad); }
  .badge.todo { background: var(--line); color: var(--muted); }
  details.bulk { margin-top: 14px; font-size: 13px; color: var(--muted); }
  details.bulk button.danger { margin-top: 8px; font-size: 13px; padding: 8px 12px; background: var(--bad-bg);
    color: var(--bad); border: 1px solid var(--bad); border-radius: 8px; font-weight: 600; }
  .card + .card { margin-top: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>SKYMIND · ALTIN KÜME İNCELEME</h1>
    <div class="stats" id="stats"></div>
  </header>
  <div class="bar"><i id="barfill"></i></div>
  <div id="app"></div>
  <div class="help">
    <kbd>D</kbd>/<kbd>Enter</kbd> doğru &nbsp; <kbd>N</kbd> hatalı &nbsp; <kbd>←</kbd> önceki &nbsp; <kbd>→</kbd> sonraki &nbsp;
    <kbd>Z</kbd> geri al &nbsp; <kbd>E</kbd> komutu düzelt &nbsp; <kbd>1</kbd>–<kbd>5</kbd> hatalı nedeni &nbsp; <kbd>J</kbd> ham JSON
  </div>
</div>
<div class="toast" id="toast" hidden></div>
<script>
"use strict";
const DIR = {N:"kuzey",NE:"kuzeydoğu",E:"doğu",SE:"güneydoğu",S:"güney",SW:"güneybatı",W:"batı",NW:"kuzeybatı"};
const MISSING = {center:"hedef bölge",target:"hedef",altitude_m:"irtifa",speed_ms:"hız",radius_m:"yarıçap",
                 waypoints:"güzergâh noktaları",duration_s:"süre",at:"iniş yeri",distance_m:"mesafe"};
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hl = s => esc(s).replace(/\d+(?:[.,]\d+)?/g, m => `<mark>${m}</mark>`);   // sayıları vurgula
const len = v => v >= 1000 ? `${v/1000} km (${v} m)` : `${v} m`;
const loc = l => l.kind === "coords" ? `koordinat ${l.lat}, ${l.lon}`
  : l.kind === "named" ? `“${l.name}”`
  : `${DIR[l.direction]} yönünde${l.distance_m ? " " + len(l.distance_m) : ""} (${l.origin === "current" ? "mevcut konuma göre" : "üsse göre"})`;
const alt = v => `irtifa ${v} m`;
function step(s) {
  switch (s.action) {
    case "takeoff": return `Kalkış → ${alt(s.altitude_m)}`;
    case "goto": return `Git → ${loc(s.target)}` + (s.altitude_m != null ? `, ${alt(s.altitude_m)}` : "") + (s.speed_ms != null ? `, hız ${s.speed_ms} m/s` : "");
    case "scan": return `Tara → merkez ${loc(s.center)}, yarıçap ${len(s.radius_m)}, ${alt(s.altitude_m)}`;
    case "patrol": return `Devriye → ${s.waypoints.map(loc).join(" → ")}, ${alt(s.altitude_m)}, ${s.loops} tur`;
    case "loiter": return `Dön/bekle → merkez ${loc(s.center)}, yarıçap ${len(s.radius_m)}, ${alt(s.altitude_m)}` + (s.duration_s != null ? `, süre ${s.duration_s} sn (${s.duration_s/60} dk)` : "");
    case "set_speed": return `Hızı ayarla → ${s.speed_ms} m/s`;
    case "return_to_launch": return "Eve dön";
    case "land": return "İn" + (s.at ? ` → ${loc(s.at)}` : " (bulunulan yerde)");
    default: return JSON.stringify(s);
  }
}
function renderGold(g) {
  if (g.type === "clarification")
    return `<div class="out"><div class="q">❓ ${hl(g.question)}</div><div>Eksik: <b>${esc((g.missing||[]).map(m => MISSING[m] || m).join(", "))}</b></div></div>`;
  if (g.type === "refusal") return `<div class="out">⛔ Ret: ${hl(g.reason)}</div>`;
  return `<div class="out"><ol>${g.steps.map(s => `<li>${hl(step(s))}</li>`).join("")}</ol></div>`;
}

let items = [], decisions = {}, pos = 0, history = [], showJson = false, editing = false, editedCmd = null, pending = 0, lastBad = null;
const saves = {};   // id -> son kayıt isteği (neden isteği ondan sonra gider)
const REASONS = {"1":["komut_yapay","komut yapay/anlamsız"], "2":["cikti_komuta_uymuyor","çıktı komuta uymuyor (sayı/yön/yer)"],
  "3":["gereksiz_soru","gereksiz soru (bilgi komutta var)"], "4":["soru_gerekliydi","soru gerekliydi (bilgi eksik)"],
  "5":["ret_hatali","ret yersiz ya da ret gerekliydi"]};
const reasonLabel = code => (Object.values(REASONS).find(r => r[0] === code) || [0, code])[1];
const $ = id => document.getElementById(id);
function toast(msg, err) { const t = $("toast"); t.textContent = msg; t.className = "toast" + (err ? " err" : ""); t.hidden = false;
  clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, err ? 8000 : 1200); }
async function api(path, body) {
  const r = await fetch(path, body ? {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)} : {});
  if (!r.ok) throw new Error(path + " → " + r.status);
  return r.json();
}
const cur = () => items[pos];
function counts() {
  const c = {ok:0, edited:0, bad:0};
  Object.values(decisions).forEach(d => { if (c[d.status] !== undefined) c[d.status]++; });
  return c;
}
function firstUndecided(from) {
  for (let i = 0; i < items.length; i++) { const j = (from + i) % items.length; if (!decisions[items[j].id]) return j; }
  return -1;
}
function reasonTarget() {
  const c = cur();
  if (c && decisions[c.id] && decisions[c.id].status === "bad") return c.id;   // bakılan kart zaten hatalıysa onun nedeni
  return lastBad;                                                               // yoksa az önce hatalı işaretlenen
}
function reasonStrip() {
  const id = reasonTarget(); if (!id || !decisions[id]) return "";
  const d = decisions[id];
  const cmd = d.command.length > 48 ? d.command.slice(0, 48) + "…" : d.command;
  const chips = Object.entries(REASONS).map(([k, [code, label]]) =>
    `<button class="rchip${d.reason === code ? " on" : ""}" onclick="setReason('${k}')"><kbd>${k}</kbd> ${esc(label)}</button>`).join("");
  return `<div class="reasons"><b>Hatalı:</b> “${esc(cmd)}” — neden? <span style="opacity:.7">(isteğe bağlı)</span><div class="rchips">${chips}</div></div>`;
}
function setReason(k) {
  const id = reasonTarget(); if (!id || !REASONS[k] || !decisions[id]) return;
  const d = decisions[id], code = REASONS[k][0];
  d.reason = d.reason === code ? "" : code;   // aynı tuşa tekrar basmak temizler
  draw();
  (saves[id] || Promise.resolve()).then(() => api("/api/reason", {id, reason: d.reason}))
    .catch(e => toast("NEDEN KAYDEDİLEMEDİ: " + e.message, true));
}
function mapHtml() {
  return `<div class="map">` + items.map((c, i) => {
    const d = decisions[c.id], cls = !d ? "todo" : d.status === "bad" ? "bad" : "ok";
    return `<i class="cell ${cls}${i === pos ? " cur" : ""}" title="${i + 1}. ${esc(c.command.slice(0, 50))}" onclick="go(${i})"></i>`;
  }).join("") + `</div>`;
}
function draw() {
  const c = counts(), done = c.ok + c.edited + c.bad, cand = cur();
  $("stats").innerHTML = `<b>${done}</b> / ${items.length} &nbsp;·&nbsp; ✓ <b>${c.ok + c.edited}</b> &nbsp; ✗ <b>${c.bad}</b>` +
    (c.edited ? ` &nbsp; ✎ <b>${c.edited}</b>` : "");
  $("barfill").style.width = (items.length ? 100 * done / items.length : 0) + "%";
  if (!cand) { $("app").innerHTML = `<div class="card">Aday yok.</div>`; return; }
  const d = decisions[cand.id];
  const badge = !d ? `<span class="badge todo">henüz karar yok</span>`
    : d.status === "bad" ? `<span class="badge bad">✗ hatalı${d.reason ? " · " + esc(reasonLabel(d.reason)) : ""}</span>`
    : `<span class="badge ok">✓ doğru${d.status === "edited" ? " (komut düzeltildi)" : ""}</span>`;
  const shown = editedCmd ?? (d ? d.command : cand.command);
  const cmdHtml = editing
    ? `<input class="cmdinput" id="cmdinput" value="${esc(shown)}" autocomplete="off">`
    : `<p class="cmd ${shown !== cand.command ? "edited" : ""}">${hl(shown)}</p>`;
  const allDone = firstUndecided(0) === -1;
  const after = items.slice(pos + 1).filter(x => decisions[x.id]).length;
  $("app").innerHTML = `${mapHtml()}
    ${allDone ? `<div class="card done">Hepsi incelendi 🎉 Terminalde <code>Ctrl+C</code>, sonra <code>uv run python -m skymind.data.review --export</code></div>` : ""}
    <div class="card">
      <div class="top"><span class="chip ${cand.category}">${cand.category === "plan" ? "plan" : cand.category === "clarification" ? "netleştirme sorusu" : "ret"}</span>
        <span class="pos">${pos + 1} / ${items.length}</span>${badge}</div>
      <div class="label">Komut</div>${cmdHtml}
      <div class="label">Sistemin vermesi gereken çıktı</div>${renderGold(cand.gold)}
      ${showJson ? `<pre>${esc(JSON.stringify(cand.gold, null, 2))}</pre>` : ""}
      <div class="btns">
        <button class="wrong" onclick="decide('bad')">✗ Hatalı<small>N</small></button>
        <button class="good" onclick="decide('ok')">✓ Doğru<small>D / Enter</small></button>
      </div>
      <div class="sub"><button onclick="step_(-1)">← Önceki</button><button onclick="step_(1)">Sonraki →</button>
        <button onclick="undo()">Geri al (Z)</button><button onclick="startEdit()">Komutu düzelt (E)</button>
        <button onclick="showJson=!showJson;draw()">Ham JSON (J)</button></div>
      <details class="bulk"><summary>Toplu düzeltme</summary>
        <button class="danger" onclick="clearAfter()">Bu karttan SONRAKİ ${after} kararı sil (yedek alınır)</button></details>
    </div>${reasonStrip()}`;
  if (editing) { const i = $("cmdinput"); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }
}
function go(i) { pos = Math.max(0, Math.min(items.length - 1, i)); lastBad = null; editedCmd = null; editing = false; draw(); }
function step_(n) { go(pos + n); }
function decide(kind) {
  const cand = cur(); if (!cand) return;
  const prev = decisions[cand.id] || null;
  const command = editedCmd ?? (prev ? prev.command : cand.command);
  const status = kind === "bad" ? "bad" : (command !== cand.command ? "edited" : "ok");
  const reason = status === "bad" && prev && prev.status === "bad" ? (prev.reason || "") : "";
  history.push({id: cand.id, prev: prev ? {...prev} : null});
  decisions[cand.id] = {status, command, reason};
  pending++;
  const saved = api("/api/decide", {id: cand.id, status, command, reason});
  saves[cand.id] = saved;
  saved.then(() => { pending--; toast("kaydedildi ✓"); })
    .catch(e => { pending--; toast("KAYIT BAŞARISIZ: " + e.message + " (sunucu çalışıyor mu?)", true); });
  lastBad = status === "bad" ? cand.id : null;
  editedCmd = null; editing = false;
  // sınırda ilerliyorsan sıradaki karar bekleyene, geçmişi düzeltiyorsan bir sonraki karta geç
  const nxt = prev ? Math.min(pos + 1, items.length - 1) : firstUndecided(pos + 1);
  pos = nxt >= 0 ? nxt : pos;
  draw();
}
function undo() {
  const h = history.pop();
  if (!h) { toast("bu oturumda geri alınacak karar yok; ← ile karta gidip yeniden karar verebilirsin"); return; }
  if (h.prev) { decisions[h.id] = h.prev; saves[h.id] = api("/api/decide", {id: h.id, status: h.prev.status, command: h.prev.command, reason: h.prev.reason || ""}); }
  else { delete decisions[h.id]; saves[h.id] = api("/api/undo", {id: h.id}); }
  saves[h.id].catch(e => toast("GERİ ALMA BAŞARISIZ: " + e.message, true));
  pos = items.findIndex(c => c.id === h.id); lastBad = null; editedCmd = null; editing = false;
  draw(); toast("geri alındı");
}
function clearAfter() {
  const cand = cur(), later = items.slice(pos + 1).filter(x => decisions[x.id]);
  if (!later.length) { toast("bu karttan sonra silinecek karar yok"); return; }
  if (!confirm(`${pos + 1}. karttan SONRAKİ ${later.length} kararın hepsi silinecek (yedek alınır). Emin misin?`)) return;
  api("/api/clear_after", {id: cand.id}).then(r => {
    items.slice(pos + 1).forEach(c => delete decisions[c.id]); history = []; lastBad = null;
    toast(`${r.cleared} karar silindi (yedek: ${r.backup})`); draw();
  }).catch(e => toast("SİLME BAŞARISIZ: " + e.message, true));
}
function startEdit() { editing = true; draw(); }

document.addEventListener("keydown", e => {
  if (e.repeat || e.ctrlKey || e.metaKey || e.altKey) return;
  if (editing) {
    if (e.key === "Enter") { e.preventDefault(); const v = $("cmdinput").value.trim(); editedCmd = v || null; editing = false; draw(); }
    else if (e.key === "Escape") { editing = false; draw(); }
    return;
  }
  const k = e.key.toLowerCase();
  if (k === "enter" || k === "d") { e.preventDefault(); decide("ok"); }
  else if (k === "n" || k === "x") { e.preventDefault(); decide("bad"); }
  else if (k === "arrowright" || k === "s") { e.preventDefault(); step_(1); }
  else if (k === "arrowleft") { e.preventDefault(); step_(-1); }
  else if (k === "z" || k === "backspace") { e.preventDefault(); undo(); }
  else if (k === "e") { e.preventDefault(); startEdit(); }
  else if (k === "j") { showJson = !showJson; draw(); }
  else if (k >= "1" && k <= "5") setReason(k);
});
window.addEventListener("beforeunload", e => { if (pending > 0) { e.preventDefault(); e.returnValue = ""; } });

api("/api/state").then(s => { items = s.items; decisions = s.decisions; const f = firstUndecided(0); pos = f >= 0 ? f : 0; draw(); })
  .catch(e => { $("app").innerHTML = `<div class="card">Sunucuya bağlanılamadı: ${esc(e.message)}</div>`; });
</script>
</body>
</html>
