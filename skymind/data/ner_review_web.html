<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SkyMind NER Seti İnceleme</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --ink: #14181f; --muted: #667085; --line: #d9dde3;
    --ok: #1a7f4b; --ok-bg: #e3f4ea; --bad: #b42318; --bad-bg: #fde8e6; --accent: #2457d6; --warn: #e0a100;
    --ALT: #dbe7ff; --ALTi: #1d3f9e; --RADIUS: #ffe3c2; --RADIUSi: #8a4b00; --DIST: #e0f4d8; --DISTi: #25661a;
    --SPEED: #ffd9e6; --SPEEDi: #9b1c4d; --DUR: #e6ddff; --DURi: #4a2c9e; --COORD: #d3f1f0; --COORDi: #0b6662;
    --PLACE: #fff1b8; --PLACEi: #7a5a00; --DIR: #e8e8e8; --DIRi: #3a3a3a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101319; --card: #181c24; --ink: #eceff4; --muted: #98a2b3; --line: #2a303b;
      --ok: #4ade80; --ok-bg: #12301f; --bad: #f87171; --bad-bg: #3a1716; --accent: #7aa2ff; --warn: #ffd36b;
      --ALT: #1c2a4d; --ALTi: #9db8ff; --RADIUS: #4a3010; --RADIUSi: #ffbf70; --DIST: #1d3a16; --DISTi: #9be28a;
      --SPEED: #4a1730; --SPEEDi: #ff9fc2; --DUR: #2f2352; --DURi: #bda6ff; --COORD: #0f3a38; --COORDi: #7be0da;
      --PLACE: #4a3d0a; --PLACEi: #ffe07a; --DIR: #333a45; --DIRi: #d6dbe3;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, "Segoe UI", sans-serif; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 16px; }
  header { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: baseline; margin-bottom: 8px; }
  header h1 { font-size: 15px; margin: 0; color: var(--muted); font-weight: 600; letter-spacing: .02em; }
  .stats { font-variant-numeric: tabular-nums; font-size: 14px; color: var(--muted); } .stats b { color: var(--ink); }
  .bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-bottom: 14px; }
  .bar > i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .15s; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 22px 24px; }
  .card + .card { margin-top: 12px; }
  .chip { display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: .06em; padding: 2px 10px; border-radius: 99px;
          background: var(--line); color: var(--muted); }
  .top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .pos { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .badge { font-size: 13px; font-weight: 700; padding: 2px 10px; border-radius: 99px; margin-left: auto; }
  .badge.ok { background: var(--ok-bg); color: var(--ok); } .badge.bad { background: var(--bad-bg); color: var(--bad); }
  .badge.todo { background: var(--line); color: var(--muted); }
  .sent { font-size: 26px; line-height: 2.1; font-weight: 500; margin: 14px 0 6px; word-break: break-word; }
  .ent { display: inline-block; padding: 0 8px; border-radius: 8px; line-height: 1.5; margin: 0 1px; white-space: nowrap; }
  .ent b { font-weight: 600; } .ent i { font-style: normal; font-size: 11px; font-weight: 800; letter-spacing: .05em; margin-left: 6px; opacity: .85; }
  .ent.ALT { background: var(--ALT); color: var(--ALTi); } .ent.RADIUS { background: var(--RADIUS); color: var(--RADIUSi); }
  .ent.DIST { background: var(--DIST); color: var(--DISTi); } .ent.SPEED { background: var(--SPEED); color: var(--SPEEDi); }
  .ent.DUR { background: var(--DUR); color: var(--DURi); } .ent.COORD { background: var(--COORD); color: var(--COORDi); }
  .ent.PLACE { background: var(--PLACE); color: var(--PLACEi); } .ent.DIR { background: var(--DIR); color: var(--DIRi); }
  u.miss { text-decoration: underline wavy var(--bad); text-underline-offset: 5px; }
  .label { margin: 16px 0 4px; font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
  table { border-collapse: collapse; font-size: 15px; } td { padding: 2px 14px 2px 0; } td.t { font-weight: 600; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 10px; font-size: 13px; color: var(--muted); }
  .checks { margin: 8px 0 0; padding-left: 20px; font-size: 14px; color: var(--muted); }
  .note { margin-top: 14px; padding: 8px 12px; border-radius: 8px; font-size: 14px; background: #fff6dc; border: 1px solid var(--warn); color: #6b4a00; }
  @media (prefers-color-scheme: dark) { .note { background: #3a2f0d; color: #ffd36b; } }
  .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 18px; }
  button { font: inherit; font-weight: 700; font-size: 18px; padding: 16px 12px; border-radius: 12px; cursor: pointer; border: 2px solid transparent; }
  button small { display: block; font-weight: 500; font-size: 12px; opacity: .75; }
  .good { background: var(--ok-bg); color: var(--ok); border-color: var(--ok); }
  .wrong { background: var(--bad-bg); color: var(--bad); border-color: var(--bad); }
  .sub { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .sub button { font-size: 14px; font-weight: 600; padding: 8px 14px; background: var(--card); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; }
  .edit { width: 100%; font: inherit; font-size: 17px; padding: 8px 10px; border-radius: 8px; border: 2px solid var(--accent);
          background: var(--card); color: var(--ink); }
  .err { color: var(--bad); font-weight: 600; font-size: 14px; margin-top: 4px; }
  .map { display: flex; flex-wrap: wrap; gap: 3px; margin-bottom: 12px; }
  .cell { width: 14px; height: 14px; border-radius: 3px; background: var(--line); cursor: pointer; }
  .cell.ok { background: var(--ok); } .cell.bad { background: var(--bad); } .cell.edited { background: var(--accent); }
  .cell.cur { outline: 2px solid var(--accent); outline-offset: 1px; } .cell.note { box-shadow: 0 0 0 2px var(--warn); }
  .help { margin-top: 14px; font-size: 13px; color: var(--muted); }
  kbd { background: var(--card); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 0 6px; font: 12px ui-monospace, monospace; }
  .toast { position: fixed; right: 14px; bottom: 14px; background: var(--card); border: 1px solid var(--line); padding: 8px 14px; border-radius: 10px; font-size: 13px; color: var(--muted); }
  .toast.errt { border-color: var(--bad); color: var(--bad); font-weight: 700; }
  .done { text-align: center; padding: 28px 10px; } code { background: var(--bg); padding: 2px 6px; border-radius: 5px; }
</style>
</head>
<body>
<div class="wrap">
  <header><h1>SKYMIND · NER ELLE SET İNCELEME</h1><div class="stats" id="stats"></div></header>
  <div class="bar"><i id="barfill"></i></div>
  <div id="app"></div>
  <div class="help">
    <kbd>D</kbd>/<kbd>Enter</kbd> doğru &nbsp; <kbd>N</kbd> hatalı (kümeden çıkar) &nbsp; <kbd>E</kbd> etiketleri düzelt &nbsp;
    <kbd>←</kbd> önceki &nbsp; <kbd>→</kbd> sonraki &nbsp; <kbd>Z</kbd> geri al
  </div>
</div>
<div class="toast" id="toast" hidden></div>
<script>
"use strict";
const LABELS = {ALT:"irtifa / yükseklik", RADIUS:"yarıçap", DIST:"mesafe", SPEED:"hız", DUR:"süre", COORD:"koordinat (yalnızca sayı)", PLACE:"yer adı", DIR:"yön"};
const MARK = /\[([^\]|]+)\|([A-Z]+)\]/g;
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const markNums = s => esc(s).replace(/\d+(?:[.,]\d+)?/g, m => `<u class="miss" title="etiket dışında kalan sayı">${m}</u>`);
function parse(markup) {                       // [{text, label|null}]
  const out = []; let pos = 0; MARK.lastIndex = 0; let m;
  while ((m = MARK.exec(markup))) { if (m.index > pos) out.push({text: markup.slice(pos, m.index), label: null}); out.push({text: m[1], label: m[2]}); pos = MARK.lastIndex; }
  if (pos < markup.length) out.push({text: markup.slice(pos), label: null});
  return out;
}
function renderSentence(markup) {
  return parse(markup).map(s => s.label
    ? `<span class="ent ${esc(s.label)}"><b>${esc(s.text)}</b><i>${esc(s.label)}</i></span>`
    : markNums(s.text)).join("");
}
function clientError(markup) {
  const rest = markup.replace(MARK, "");
  if (/[\[\]|]/.test(rest)) return "Bozuk işaretleme: köşeli parantez veya | kaldı";
  for (const s of parse(markup)) if (s.label && !LABELS[s.label]) return `Bilinmeyen etiket: ${s.label}`;
  return "";
}
let items = [], decisions = {}, pos = 0, history = [], editing = false, editText = "", editErr = "", pending = 0;
const saves = {};
const $ = id => document.getElementById(id);
function toast(msg, err) { const t = $("toast"); t.textContent = msg; t.className = "toast" + (err ? " errt" : ""); t.hidden = false;
  clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, err ? 8000 : 1200); }
async function api(path, body) {
  const r = await fetch(path, body ? {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)} : {});
  if (!r.ok) { let m = ""; try { m = (await r.json()).error; } catch (_) {} throw new Error(m || (path + " → " + r.status)); }
  return r.json();
}
const cur = () => items[pos];
function counts() { const c = {ok:0, edited:0, bad:0}; Object.values(decisions).forEach(d => { if (c[d.status] !== undefined) c[d.status]++; }); return c; }
function firstUndecided(from) { for (let i = 0; i < items.length; i++) { const j = (from + i) % items.length; if (!decisions[items[j].id]) return j; } return -1; }
function mapHtml() {
  return `<div class="map">` + items.map((c, i) => {
    const d = decisions[c.id], cls = !d ? "" : d.status;
    return `<i class="cell ${cls}${i === pos ? " cur" : ""}${c.note ? " note" : ""}" title="${i + 1}. ${esc(c.markup.replace(MARK, "$1").slice(0, 50))}" onclick="go(${i})"></i>`;
  }).join("") + `</div>`;
}
function entityTable(markup) {
  const ents = parse(markup).filter(s => s.label);
  if (!ents.length) return "<i>(etiketli varlık yok)</i>";
  return `<table>` + ents.map(e => `<tr><td class="t">${esc(e.text)}</td><td>→ ${esc(e.label)}</td><td style="color:var(--muted)">${esc(LABELS[e.label] || "?")}</td></tr>`).join("") + `</table>`;
}
function draw() {
  const c = counts(), done = c.ok + c.edited + c.bad, cand = cur();
  $("stats").innerHTML = `<b>${done}</b> / ${items.length} &nbsp;·&nbsp; ✓ <b>${c.ok}</b>` + (c.edited ? ` &nbsp; ✎ <b>${c.edited}</b>` : "") + ` &nbsp; ✗ <b>${c.bad}</b>`;
  $("barfill").style.width = (items.length ? 100 * done / items.length : 0) + "%";
  if (!cand) { $("app").innerHTML = `<div class="card">Cümle yok.</div>`; return; }
  const d = decisions[cand.id], markup = d ? d.markup : cand.markup;
  const badge = !d ? `<span class="badge todo">henüz karar yok</span>` : d.status === "bad" ? `<span class="badge bad">✗ hatalı (kümeden çıkar)</span>`
    : `<span class="badge ok">✓ doğru${d.status === "edited" ? " (etiketler düzeltildi)" : ""}</span>`;
  const shownMarkup = editing ? editText : markup;
  const legend = Object.entries(LABELS).map(([k, v]) => `<span class="ent ${k}"><b>${k}</b></span> ${esc(v)}`).join(" &nbsp; ");
  const allDone = firstUndecided(0) === -1;
  $("app").innerHTML = `${mapHtml()}
    ${allDone ? `<div class="card done">Hepsi incelendi 🎉 Terminalde <code>Ctrl+C</code>, sonra <code>uv run python -m skymind.data.ner_review --apply</code></div>` : ""}
    <div class="card">
      <div class="top"><span class="chip">${esc(cand.section)}</span><span class="pos">${pos + 1} / ${items.length}</span>${badge}</div>
      <div class="sent">${renderSentence(shownMarkup)}</div>
      ${editing ? `<input class="edit" id="edit" value="${esc(editText)}" autocomplete="off" spellcheck="false">
        <div class="err">${esc(editErr)}</div><div style="font-size:13px;color:var(--muted)">Biçim: <code>[metin|ETİKET]</code>. Cümlenin kendisini değiştirme, yalnızca köşeli parantezleri ve etiketleri. Enter kaydeder, Esc vazgeçer.</div>`
        : `<div class="label">Etiketli varlıklar</div>${entityTable(markup)}`}
      <div class="label">Şunlara bak</div>
      <ol class="checks">
        <li><b>Tür:</b> her renkli kutu doğru türde mi?</li>
        <li><b>Sınır:</b> birim kutunun içinde mi ("500 m")? Ekler yer adıyla birlikte mi ("Alfa noktasına")? Hızda "saatte" dahil mi?</li>
        <li><b>Eksik:</b> etiket dışında kalmış sayı (dalgalı kırmızı alt çizgi), yer, yön ya da süre var mı?</li>
        <li><b>Fazla:</b> etiketlenmemesi gereken bir şey etiketlenmiş mi?</li>
      </ol>
      <div class="label">Etiketler</div><div class="legend">${legend}</div>
      ${cand.note ? `<div class="note"><b>Claude'un notu:</b> ${esc(cand.note)}</div>` : ""}
      <div class="btns">
        <button class="wrong" onclick="decide('bad')">✗ Hatalı<small>N, kümeden çıkar (düzeltmek için E)</small></button>
        <button class="good" onclick="decide('ok')">✓ Doğru<small>D / Enter</small></button>
      </div>
      <div class="sub"><button onclick="step_(-1)">← Önceki</button><button onclick="step_(1)">Sonraki →</button>
        <button onclick="undo()">Geri al (Z)</button><button onclick="startEdit()">Etiketleri düzelt (E)</button></div>
    </div>`;
  if (editing) { const i = $("edit"); i.focus(); i.setSelectionRange(i.value.length, i.value.length);
    i.addEventListener("input", () => { editText = i.value; editErr = clientError(editText);
      document.querySelector(".sent").innerHTML = renderSentence(editText); document.querySelector(".err").textContent = editErr; }); }
}
function go(i) { pos = Math.max(0, Math.min(items.length - 1, i)); editing = false; editErr = ""; draw(); }
function step_(n) { go(pos + n); }
function startEdit() { const d = decisions[cur().id]; editText = d ? d.markup : cur().markup; editErr = ""; editing = true; draw(); }
function send(id, status, markup) {
  pending++;
  const p = api("/api/decide", {id, status, markup});
  saves[id] = p;
  p.then(() => { pending--; toast("kaydedildi ✓"); }).catch(e => { pending--; toast("KAYIT BAŞARISIZ: " + e.message, true); });
  return p;
}
function decide(kind, markupOverride) {
  const cand = cur(); if (!cand) return;
  const prev = decisions[cand.id] || null;
  const markup = markupOverride ?? (prev ? prev.markup : cand.markup);
  const status = kind === "bad" ? "bad" : (markup !== cand.markup ? "edited" : "ok");
  history.push({id: cand.id, prev: prev ? {...prev} : null});
  decisions[cand.id] = {status, markup};
  send(cand.id, status, markup);
  editing = false; editErr = "";
  const nxt = prev ? Math.min(pos + 1, items.length - 1) : firstUndecided(pos + 1);
  pos = nxt >= 0 ? nxt : pos; draw();
}
function undo() {
  const h = history.pop();
  if (!h) { toast("bu oturumda geri alınacak karar yok; ← ile karta gidip yeniden karar verebilirsin"); return; }
  if (h.prev) { decisions[h.id] = h.prev; saves[h.id] = api("/api/decide", {id: h.id, status: h.prev.status, markup: h.prev.markup}); }
  else { delete decisions[h.id]; saves[h.id] = api("/api/undo", {id: h.id}); }
  saves[h.id].catch(e => toast("GERİ ALMA BAŞARISIZ: " + e.message, true));
  pos = items.findIndex(c => c.id === h.id); editing = false; draw(); toast("geri alındı");
}
document.addEventListener("keydown", e => {
  if (e.repeat || e.ctrlKey || e.metaKey || e.altKey) return;
  if (editing) {
    if (e.key === "Enter") { e.preventDefault(); const err = clientError(editText); if (err) { editErr = err; draw(); return; }
      const cand = cur(), markup = editText.trim();
      api("/api/decide", {id: cand.id, status: "edited", markup}).then(() => {   // sunucu da doğrular (cümle metni değişmemeli)
        const prev = decisions[cand.id] || null; history.push({id: cand.id, prev: prev ? {...prev} : null});
        decisions[cand.id] = {status: markup !== cand.markup ? "edited" : "ok", markup}; editing = false; editErr = "";
        const nxt = prev ? Math.min(pos + 1, items.length - 1) : firstUndecided(pos + 1); pos = nxt >= 0 ? nxt : pos; draw(); toast("kaydedildi ✓");
      }).catch(er => { editErr = er.message; draw(); }); }
    else if (e.key === "Escape") { editing = false; editErr = ""; draw(); }
    return;
  }
  const k = e.key.toLowerCase();
  if (k === "enter" || k === "d") { e.preventDefault(); decide("ok"); }
  else if (k === "n" || k === "x") { e.preventDefault(); decide("bad"); }
  else if (k === "arrowright" || k === "s") { e.preventDefault(); step_(1); }
  else if (k === "arrowleft") { e.preventDefault(); step_(-1); }
  else if (k === "z" || k === "backspace") { e.preventDefault(); undo(); }
  else if (k === "e") { e.preventDefault(); startEdit(); }
});
window.addEventListener("beforeunload", e => { if (pending > 0) { e.preventDefault(); e.returnValue = ""; } });
api("/api/state").then(s => { items = s.items; decisions = s.decisions; const f = firstUndecided(0); pos = f >= 0 ? f : 0; draw(); })
  .catch(e => { $("app").innerHTML = `<div class="card">Sunucuya bağlanılamadı: ${esc(e.message)}</div>`; });
</script>
</body>
</html>
