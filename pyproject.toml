[project]
name = "skymind"
version = "0.1.0"
description = "Türkçe İHA operatör asistanı: komut -> doğrulanmış JSON görev planı (araştırma prototipi)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.10",
    "jsonschema>=4.22",
    "mlflow>=3.18",
    "pyyaml>=6",
]
train = [
    "torch>=2.5",
    "transformers>=4.46",
    "peft>=0.13",
    "trl>=0.12",
    "datasets>=3",
    "accelerate>=1.0",
    "bitsandbytes>=0.45",
]
optimize = [
    "onnxruntime-genai>=0.20",
    "onnxruntime>=1.32",
    "onnx>=1.23",
    "onnx-ir",
    "onnxscript",
    "sentencepiece",
]

serve = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "prometheus-client>=0.21",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["skymind"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# eğitim betikleri ince yapıştırıcı koddur; trl/transformers tipleri eksik
module = ["skymind.planner.sft", "skymind.planner.dpo"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["onnxruntime_genai", "onnxruntime_genai.*"]
ignore_missing_imports = true
