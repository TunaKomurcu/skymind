# Compose/Podman için statik hedefler. Kubernetes için prometheus.k8s.yml kullanılır.
global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: gateway
    static_configs:
      - targets: ["gateway:8000"]
  - job_name: backend
    static_configs:
      - targets: ["skymind-a:8080"]
        labels: { variant: a }
      - targets: ["skymind-b:8080"]
        labels: { variant: b }
