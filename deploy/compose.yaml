# Tek komutla demo (Podman ya da Docker):
#   podman compose -f deploy/compose.yaml up --build
#   -> ağ geçidi http://localhost:8000, Prometheus :9090, Grafana :3000 (admin/admin)
#
# Durum: podman-compose 1.6.0 + Podman 4.9.3 (rootless, WSL2) ile çalıştırıldı (deploy/README.md).
# İki model sürümü (A/B) için GGUF dosyaları outputs/gguf altında olmalı; adları değişkenle verilir:
#   MODEL_A=skymind-sft-Q5_K_M.gguf MODEL_B=skymind-dpo-Q5_K_M.gguf
x-backend: &backend
  build: { context: .., dockerfile: deploy/containers/Containerfile.cpp }
  image: skymind-cpp
  volumes:
    - ../outputs/gguf:/models:ro,Z
  read_only: true
  restart: unless-stopped

services:
  skymind-a:
    <<: *backend
    command: ["-m", "/models/${MODEL_A:-skymind-sft-Q5_K_M.gguf}"]
  skymind-b:
    <<: *backend
    command: ["-m", "/models/${MODEL_B:-skymind-dpo-Q5_K_M.gguf}"]

  gateway:
    build: { context: .., dockerfile: deploy/containers/Containerfile.gateway }
    image: skymind-gateway
    command:
      - --variant
      - a=http://skymind-a:8080@${WEIGHT_A:-50}
      - --variant
      - b=http://skymind-b:8080@${WEIGHT_B:-50}
    ports: ["8000:8000"]
    depends_on: [skymind-a, skymind-b]
    read_only: true
    restart: unless-stopped

  prometheus:
    image: docker.io/prom/prometheus:v2.55.1
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro,Z
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro,Z
    ports: ["9090:9090"]
    depends_on: [gateway]

  grafana:
    image: docker.io/grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro,Z
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro,Z
    ports: ["3000:3000"]
    depends_on: [prometheus]
