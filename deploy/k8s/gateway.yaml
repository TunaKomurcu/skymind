apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: skymind
  labels: { app: skymind-gateway }
spec:
  replicas: 2
  selector:
    matchLabels: { app: skymind-gateway }
  template:
    metadata:
      labels: { app: skymind-gateway }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: gateway
          image: skymind-gateway:latest
          imagePullPolicy: IfNotPresent
          # A/B bölme oranı: ağırlıkları değiştirip `kubectl rollout restart deploy/gateway`
          args:
            - --variant
            - a=http://skymind-a:8080@90
            - --variant
            - b=http://skymind-b:8080@10
          ports: [{ name: http, containerPort: 8000 }]
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: skymind
spec:
  selector: { app: skymind-gateway }
  ports: [{ name: http, port: 8000, targetPort: http }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gateway
  namespace: skymind
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: gateway }
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
