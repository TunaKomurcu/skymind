# Prometheus + Grafana. Yapılandırmalar kustomization.yaml'daki configMapGenerator'dan gelir.
apiVersion: v1
kind: ServiceAccount
metadata: { name: prometheus, namespace: skymind }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: prometheus, namespace: skymind }
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: prometheus, namespace: skymind }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: prometheus }
subjects:
  - { kind: ServiceAccount, name: prometheus, namespace: skymind }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: skymind
  labels: { app: prometheus }
spec:
  replicas: 1
  selector:
    matchLabels: { app: prometheus }
  template:
    metadata:
      labels: { app: prometheus }
    spec:
      serviceAccountName: prometheus
      securityContext: { runAsNonRoot: true, runAsUser: 65534, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: prometheus
          image: docker.io/prom/prometheus:v2.55.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.retention.time=3d
          ports: [{ name: http, containerPort: 9090 }]
          readinessProbe: { httpGet: { path: /-/ready, port: http } }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus, readOnly: true }
            - { name: data, mountPath: /prometheus }
      volumes:
        - name: config
          configMap: { name: prometheus-config }
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata: { name: prometheus, namespace: skymind }
spec:
  selector: { app: prometheus }
  ports: [{ name: http, port: 9090, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: skymind
  labels: { app: grafana }
spec:
  replicas: 1
  selector:
    matchLabels: { app: grafana }
  template:
    metadata:
      labels: { app: grafana }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 472, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: grafana
          image: docker.io/grafana/grafana:11.3.0
          env:
            - { name: GF_AUTH_ANONYMOUS_ENABLED, value: "true" }
            - { name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: Viewer }
          ports: [{ name: http, containerPort: 3000 }]
          readinessProbe: { httpGet: { path: /api/health, port: http } }
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { memory: 384Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: datasources, mountPath: /etc/grafana/provisioning/datasources, readOnly: true }
            - { name: dashboard-provider, mountPath: /etc/grafana/provisioning/dashboards, readOnly: true }
            - { name: dashboards, mountPath: /var/lib/grafana/dashboards, readOnly: true }
      volumes:
        - name: datasources
          configMap: { name: grafana-datasources }
        - name: dashboard-provider
          configMap: { name: grafana-dashboard-provider }
        - name: dashboards
          configMap: { name: grafana-dashboards }
---
apiVersion: v1
kind: Service
metadata: { name: grafana, namespace: skymind }
spec:
  selector: { app: grafana }
  ports: [{ name: http, port: 3000, targetPort: http }]
